; Replaces /usr/local/etc/php-fpm.conf from the markoshust/magento-php image, which forces a Unix socket
; (/sock/phpfpm.sock): here nginx runs in another container and connects over TCP 9000.
[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[www]
listen = 9000
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[memory_limit] = 768M
